name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - "*.tf"
      - ".github/workflows/terraform-apply.yml"
  schedule:
    # Semanal (lunes 06:00 UTC) - no es solo higiene de CI/CD, es lo que
    # renueva el certificado Let's Encrypt: acme_certificate revisa en cada
    # apply si faltan <30 días para el vencimiento y re-emite solo en ese
    # caso (ver acme.tf). Sin este trigger, nada dispara ese apply y el
    # certificado se vence en silencio.
    - cron: "0 6 * * 1"

permissions:
  id-token: write # requerido para autenticar contra Azure vía OIDC
  contents: read

concurrency:
  group: terraform-apply
  cancel-in-progress: false # nunca cancelar un apply en curso

env:
  ARM_CLIENT_ID: f960d816-6479-4cec-9f8f-c05ff5014bef # containerapps-poc-agent
  ARM_TENANT_ID: def99609-2ac6-4adf-a1c7-18d4c97d889f
  ARM_SUBSCRIPTION_ID: 0a314178-d091-4e21-87d5-48ff79bd7ca4
  TF_VAR_subscription_id: 0a314178-d091-4e21-87d5-48ff79bd7ca4
  TF_VAR_acme_email: ${{ secrets.ACME_EMAIL }}
  TF_VAR_network_containerapps_subnet_id: /subscriptions/0a314178-d091-4e21-87d5-48ff79bd7ca4/resourceGroups/jalcalaroot/providers/Microsoft.Network/virtualNetworks/vnet-jalcalaroot/subnets/snet-containerapps
  TF_VAR_network_appgw_subnet_id: /subscriptions/0a314178-d091-4e21-87d5-48ff79bd7ca4/resourceGroups/jalcalaroot/providers/Microsoft.Network/virtualNetworks/vnet-jalcalaroot/subnets/snet-appgw
  TF_VAR_network_vnet_id: /subscriptions/0a314178-d091-4e21-87d5-48ff79bd7ca4/resourceGroups/jalcalaroot/providers/Microsoft.Network/virtualNetworks/vnet-jalcalaroot
  TF_VAR_network_log_analytics_workspace_id: /subscriptions/0a314178-d091-4e21-87d5-48ff79bd7ca4/resourceGroups/jalcalaroot/providers/Microsoft.OperationalInsights/workspaces/log-network-jalcalaroot
  ARM_USE_OIDC: true

jobs:
  apply:
    name: Apply
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Ver el comentario equivalente en terraform-plan.yml: necesario para
      # que el provider "acme" (challenge DNS-01) autentique - no comparte
      # la resolución OIDC interna de azurerm.
      - name: Azure login (OIDC)
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.13"
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan
